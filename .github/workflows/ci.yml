name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Set up Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Vet
        run: task lint

      - name: Build
        run: task build

      - name: Test
        run: task test
